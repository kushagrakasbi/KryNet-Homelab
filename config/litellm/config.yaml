# =============================================================================
#  LITELLM SETTINGS
# =============================================================================
litellm_settings:
  drop_params: true             # Ignore unsupported params per provider
  set_verbose: false            # Set true for debugging
  num_retries: 2                # Retry failed requests
  request_timeout: 120          # 2 min timeout for long responses
  cache: false                  # Requires Redis; enable if you add one

# =============================================================================
#  GENERAL SETTINGS
# =============================================================================
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
