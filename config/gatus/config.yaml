# 🔴 SECRETS ARE ENV REFS, NEVER LITERALS. Gatus expands ${VAR} from its container
# environment; the values live only in the Portainer stack env for monitoring-stack.
# Both were literal here until 2026-09-12 and are in git history, so both were rotated.
alerting:
  gotify:
    server-url: "http://gotify:80"
    token: "${GOTIFY_TOKEN}"
    priority: 5
    default-alert:
      description: "health-check failed"
      send-on-resolved: true
      failure-threshold: 3
      success-threshold: 2
      minimum-reminder-interval: 1h
  discord:
    webhook-url: "${DISCORD_WEBHOOK_URL}"
    default-alert:
      description: "health-check failed"
      send-on-resolved: true
      failure-threshold: 3
      success-threshold: 2
      minimum-reminder-interval: 1h

ui:
  title: "Krynet Status"
  header: "System Health"

endpoints:
  # =================================================
  # 🧠 CORE INFRASTRUCTURE (Critical tier)
  # =================================================
  - name: "Agni (Network Core)"
    group: "Core"
    url: "tcp://192.168.0.200:80"
    interval: 30s
    conditions:
      - "[CONNECTED] == true"
    alerts:
      - type: gotify
        provider-override:
          priority: 8   # wake-me tier
      - type: discord
        failure-threshold: 2
        minimum-reminder-interval: 30m

  - name: "Prime (TrueNAS UI)"
    group: "Core"
    url: "http://192.168.0.100:88"
    interval: 30s
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] == 200"
    alerts:
      - type: gotify
        provider-override:
          priority: 8   # wake-me tier
      - type: discord
        failure-threshold: 2
        minimum-reminder-interval: 30m

  - name: "Caddy (Ingress)"
    group: "Core"
    # 🔴 Caddy runs network_mode: host, so it is NOT reachable as `caddy:443` from
    # agni_net — probe Agni's host port directly. A raw TCP check deliberately, so this
    # isolates "the ingress is down" from "one backend is down"; the ~30 https checks
    # already exercise Caddy indirectly and would all fail together.
    url: "tcp://192.168.0.200:443"
    interval: 30s
    conditions:
      - "[CONNECTED] == true"
    alerts:
      - type: gotify
        provider-override:
          priority: 8   # wake-me tier
      - type: discord
        failure-threshold: 2
        minimum-reminder-interval: 30m

  - name: "Gatus (Self)"
    group: "Core"
    # ⚠️ A self-check catches Gatus DEGRADED (process up, checks wedged) but CANNOT
    # catch Gatus dead — nothing runs to notice. Total death needs an external
    # watcher; the intended one is a Healthchecks dead-man's switch that only gets
    # pinged while /health returns UP. Not yet wired — see docs.
    url: "http://192.168.0.200:3001/health"
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == UP"
    alerts:
      - type: gotify
        provider-override:
          priority: 8   # wake-me tier
      - type: discord
        failure-threshold: 2
        minimum-reminder-interval: 30m

  - name: "Legion (AI & GPU Core)"
    group: "Core"
    url: "tcp://192.168.0.150:22"
    interval: 30s
    conditions:
      - "[CONNECTED] == true"
    alerts:
      - type: gotify
        provider-override:
          priority: 8   # wake-me tier
      - type: discord
        failure-threshold: 2
        minimum-reminder-interval: 30m

  # Standard tier. CPU averaged >90 °C for 15 min, OR the sensor stopped reporting —
  # an empty Prometheus answer must not read as "cool". Legion sat at 95-100 °C for weeks unseen.
  - name: "Legion Thermals (CPU)"
    group: "Core"
    url: "http://192.168.0.200:9090/api/v1/query?query=avg_over_time%28node_hwmon_temp_celsius%7Binstance%3D~%22192.168.0.150%3A.%2A%22%2Cchip%3D%22platform_coretemp_0%22%2Csensor%3D%22temp1%22%7D%5B15m%5D%29%20%3E%2090%20or%20absent%28node_hwmon_temp_celsius%7Binstance%3D~%22192.168.0.150%3A.%2A%22%2Cchip%3D%22platform_coretemp_0%22%2Csensor%3D%22temp1%22%7D%29"
    interval: 5m
    conditions:
      - "[STATUS] == 200"
      - "len([BODY].data.result) == 0"
    alerts:
      - type: gotify
      - type: discord

