alerting:
  gotify:
    server-url: "http://gotify:80"
    token: ""
    priority: 5
    default-alert:
      description: "health-check failed"
      send-on-resolved: true
      failure-threshold: 3
      success-threshold: 2
      minimum-reminder-interval: 1h
  discord:
    webhook-url: "https://discord.com/api/webhooks/YOUR_WEBHOOK_ID/YOUR_WEBHOOK_TOKEN"
    default-alert:
      description: "health-check failed"
      send-on-resolved: true
      failure-threshold: 3
      success-threshold: 2
      minimum-reminder-interval: 1h

ui:
  title: "Krynet Status"
  header: "System Health"

endpoints:
