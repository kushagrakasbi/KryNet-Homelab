version: '3.8'

services:
  traefik:
    image: traefik:latest
    container_name: traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Mount the Docker socket so Traefik can listen to container events
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Mount the configuration files and directories we created
      - ${DOCKER_CONFIG_PATH}/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ${DOCKER_CONFIG_PATH}/traefik/dynamic_configs:/etc/traefik/dynamic_configs:ro
      - ${DOCKER_CONFIG_PATH}/traefik/letsencrypt:/letsencrypt
      - ${DOCKER_CONFIG_PATH}/traefik/logs:/logs
    environment:
      # Load the Cloudflare API Token from your .env file
      - CLOUDFLARE_DNS_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      - CLOUDFLARE_EMAIL=${CLOUDFLARE_EMAIL}

      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    networks:
      # Use the network we created
      - traefik_proxy

networks:
  traefik_proxy:
    external: true


