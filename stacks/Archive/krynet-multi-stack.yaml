name: cloudflared
services:
    cloudflared:
        env_file:
          - stack.env
        image: cloudflare/cloudflared:latest
        command: tunnel --no-autoupdate run --token ${CF_TOKEN}
        network_mode: host
        restart: 'unless-stopped'

# AI Stack is disabled
version: "3.8"

services:
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: litellm

    ports:
      - "4000:4000"
    environment:
      # MODIFIED: Use your server IP and the exposed port for the Immich DB
      # Use a separate DB named "litellm" on the same server
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASS}@192.168.0.100:5432/litellm
      - STORE_MODEL_IN_DB=True
      - PUID=${PUID} # Added for consistency
      - PGID=${PGID} # Added for consistency
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - LITELLM_SALT_KEY=${LITELLM_SALT_KEY}
    env_file:
      - stack.env
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 http://192.168.0.100:4000/health/liveliness || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - kry_net
      - traefik_proxy

  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: openwebui
    env_file:
      - stack.env
    ports:
      - "3999:8080"
    volumes:
      - ${DOCKER_CONFIG_PATH}/openwebui:/app/backend/data # MODIFIED
    environment:
      - PUID=${PUID} # Added for consistency
      - PGID=${PGID} # Added for consistency
    restart: unless-stopped
    networks:
      - kry_net
      - traefik_proxy

networks:
  kry_net:
    external: true
  traefik_proxy:
    external: true


# AdGuard Home Stack for TrueNAS
version: "3.8"

services:
  adguardhome:
    image: adguard/adguardhome:latest
    container_name: adguardhome
    ports:
      # DNS ports (required)
      - "53:53/tcp"
      - "53:53/udp"
      # Admin panel - AdGuard uses port 80 internally for web UI after setup
      - "7000:80/tcp"
      # Initial setup wizard port (only needed during first setup)
      - "7001:3000/tcp"
      # DoH (DNS-over-HTTPS) - Using 8443 to avoid conflict with NPM
      - "8443:443/tcp"      # Alternative HTTPS port for DoH
      - "8443:443/udp"
      # DoT (DNS-over-TLS)
      - "853:853/tcp"
      # DoQ (DNS-over-QUIC) 
      - "784:784/udp"
      - "8853:8853/udp"
    volumes:
      - ${DOCKER_CONFIG_PATH}/adguardhome/work:/opt/adguardhome/work
      - ${DOCKER_CONFIG_PATH}/adguardhome/conf:/opt/adguardhome/conf
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    restart: unless-stopped
    networks:
      - kry_net
      - traefik_proxy
    # Required for DHCP functionality if you plan to use it
    cap_add:
      - NET_ADMIN

networks:
  kry_net:
    external: true
  traefik_proxy:
    external: true

