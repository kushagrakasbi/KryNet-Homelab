#---------------------------------------------------------------------#
#     Immich - A simple, yet powerful dashboard for your server.      #
#---------------------------------------------------------------------#
services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    volumes:
      - /mnt/andromeda/apps/immich/uploads:/data
      - /etc/localtime:/etc/localtime:ro
    ports:
      - 2283:2283
    env_file:
      - stack.env
    depends_on:
      - redis
      - database
    restart: unless-stopped
    healthcheck:
      disable: false
    networks:
      - kry_net
      - traefik_proxy

  # ML for Immich
  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}-cuda
    volumes:
      - /mnt/andromeda/apps/immich/ml:/cache
    restart: unless-stopped
    env_file:
      - stack.env
    healthcheck:
      disable: false
    environment:
      - MACHINE_LEARNING__FACE_RECOGNITION_MODEL=mobile_face
      - MACHINE_LEARNING__FACE_DETECTION_MODEL=yunet
      - MACHINE_LEARNING__CLIP_MODEL=ViT-B-16__laion2b_s34b_b88k
    networks:
      - kry_net
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities:
                - gpu

  # Redis for Immich
  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:8-bookworm@sha256:42cba146593a5ea9a622002c1b7cba5da7be248650cbb64ecb9c6c33d29794b1
    healthcheck:
      test: redis-cli ping || exit 1
    restart: unless-stopped
    networks:
      - kry_net

  # Postgres for Immich
  database:
    container_name: immich_postgres
    image: docker.io/tensorchord/pgvecto-rs:pg14-v0.2.0@sha256:739cdd626151ff1f796dc95a6591b55a714f341c737e27f045019ceabf8e8c52
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: --data-checksums
    ports:
      - "5432:5432"
    env_file:
      - stack.env
    volumes:
      - /mnt/andromeda/apps/immich/db:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready --dbname="$${POSTGRES_DB}" --username="$${POSTGRES_USER}" ||
        exit 1; Chksum="$$(psql --dbname="$${POSTGRES_DB}"
        --username="$${POSTGRES_USER}" --tuples-only --no-align
        --command='SELECT COALESCE(SUM(checksum_failures), 0) FROM
        pg_stat_database')"; echo "checksum failure count is $$Chksum"; [
        "$$Chksum" = '0' ] || exit 1
      interval: 5m
      start_interval: 30s
      start_period: 5m
    command: postgres -c shared_preload_libraries=vectors.so -c
      'search_path="$$user", public, vectors' -c logging_collector=on -c
      max_wal_size=2GB -c shared_buffers=512MB -c wal_compression=on
    restart: unless-stopped
    networks:
      - kry_net

  # Power Tools for Immich
  power-tools:
    container_name: immich_power_tools
    image: ghcr.io/varun-raj/immich-power-tools:latest
    ports:
      - "8001:3000"
    env_file:
      - stack.env
    restart: unless-stopped
    networks:
      - kry_net
      - traefik_proxy

networks:
  kry_net:
    external: true
  traefik_proxy:
    external: true


# MEDIA Stack
version: "3.8"

services:
  # --- VPN Gateway ---
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    networks:
      - kry_net
      - traefik_proxy
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "8080:8080" # qBittorrent WebUI
      - "6881:6881" # TCP for torrents
      - "6881:6881/udp" # UDP for torrents
      # - "8085:8085" # SABnzbd WebUI
      # - "8191:8191" # FlareSolverr
      - "5055:5055" # jellyseers
      # - "6969:6969"  # Whisparr
    volumes:
      - ${DOCKER_CONFIG_PATH}/gluetun:/gluetun
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - FIREWALL_OUTBOUND_SUBNETS=192.168.0.0/24,172.16.3.0/24 # Adjust to your network
      - FIREWALL_INPUT_PORTS=8080,6881,8081,8191,5055,6969 # Ports for services
      - VPN_SERVICE_PROVIDER=surfshark
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES}
      - SERVER_COUNTRIES=${SERVER_COUNTRIES}
    restart: unless-stopped

  # --- Download Clients (Routed through Gluetun) ---
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: service:gluetun
    depends_on:
      - gluetun
    volumes:
      - ${DOCKER_CONFIG_PATH}/qbittorrent:/config
      - ${DOCKER_DATA_PATH}:/data # Pointing to the new top-level downloads folder
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8080
    restart: unless-stopped

  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd
    ports:
      - "8085:8085"
    networks:
      - kry_net
      - traefik_proxy
    env_file:
      - stack.env
    volumes:
      - ${DOCKER_CONFIG_PATH}/sabnzbd:/config
      - ${DOCKER_DATA_PATH}:/data
      # - ${DOCKER_USENET_PATH}/complete:/downloads # Pointing to the usenet complete folder
      # - ${DOCKER_USENET_PATH}/incomplete:/incomplete-downloads
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    restart: unless-stopped

  # --- Cloudflare Bypass Proxy ---
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    ports:
      - "8191:8191"
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ}
    restart: unless-stopped
    networks:
      - kry_net
      - traefik_proxy
  
  # --- Indexer Manager ---
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    ports:
      - "9696:9696"
    volumes:
      - ${DOCKER_CONFIG_PATH}/prowlarr:/config
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    restart: unless-stopped
    networks:
      - kry_net
      - traefik_proxy

  # --- Media Management ---
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    ports:
      - "8989:8989"
    volumes:
      - ${DOCKER_CONFIG_PATH}/sonarr:/config
      - ${DOCKER_DATA_PATH}:/data
      # - ${DOCKER_DOWNLOADS_PATH}:/downloads      # For torrents
      # - ${DOCKER_USENET_PATH}/complete:/usenet   # For usenet
      # - ${DOCKER_MEDIA_PATH}/TVShows:/tv         # MODIFIED: Path for TV Shows
      # - ${DOCKER_MEDIA_PATH}/Anime:/anime        # MODIFIED: Path for Anime
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    restart: unless-stopped
    networks:
      - kry_net
      - traefik_proxy

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    ports:
      - "7878:7878"
    volumes:
      - ${DOCKER_CONFIG_PATH}/radarr:/config
      - ${DOCKER_DATA_PATH}:/data
      # - ${DOCKER_DOWNLOADS_PATH}:/downloads      # For torrents
      # - ${DOCKER_USENET_PATH}/complete:/usenet   # For usenet
      # - ${DOCKER_MEDIA_PATH}/Movies:/movies      # MODIFIED: Path for Movies
      # - ${DOCKER_MEDIA_PATH}/Documentaries:/documentaries # MODIFIED: Path for Documentaries
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    restart: unless-stopped
