    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    restart: unless-stopped
    networks:
      - kry_net
      - traefik_proxy

  # --- Media Server ---
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    ports:
      - "8096:8096"
    volumes:
      - ${DOCKER_CONFIG_PATH}/jellyfin:/config
      - ${DOCKER_DATA_PATH}/media/movies:/data/movies
