version: "3"
services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    volumes:
      # FIXED: Points to the root folder where your services.yaml lives
      - /home/agni/apps/docker/homepage:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /home/agni/apps/docker/homepage/images:/app/public/images
    environment:
      - TZ=Asia/Kolkata

      - HOMEPAGE_ALLOWED_HOSTS=home.krynet.cc,home.lan.kkasbi.in,127.0.0.1,192.168.0.200,192.168.0.100
    ports:
      - "3075:3000"
    networks:
      - agni_net

  # glance:
