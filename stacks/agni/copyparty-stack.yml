services:
  copyparty:
    image: copyparty/ac:latest
    container_name: copyparty
    restart: unless-stopped
    ports:
      - "3923:3923"
    environment:
      - PUID=1000
      - PGID=1000
      # Enable dotfiles, uploads allowed
      - X_OPTS=--dots
    volumes:
      - ${DOCKER_CONFIG_PATH}/copyparty/config:/cfg
      # Add your custom volume mounts below
      # - /path/to/local:/w/Local
      # - /mnt/remote/data:/w/Remote-Data