  #     - LIBATION_BOOKS_DIR=/data
  #   volumes:
  #     # Configs
  #     - ${DOCKER_CONFIG_PATH}/libation:/config
  #     # Media Mapping (CRITICAL)
  #     # We map the host audiobook folder to '/data' inside the container
  #     - ${DOCKER_DATA_PATH}/media/audiobooks:/data
  #   networks:
  #     - kry_net
  #     - traefik_proxy

networks:
  kry_net:
    external: true
  traefik_proxy:
    external: true