version: "3.8"

services:
  # ==========================================
  # Audiobookshelf (Server & Player)
  # ==========================================
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    restart: unless-stopped
    ports:
      - "13378:80"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      # Configs (Using your variable standard)
      - ${DOCKER_CONFIG_PATH}/audiobookshelf/config:/config
      - ${DOCKER_CONFIG_PATH}/audiobookshelf/metadata:/metadata
      # Media
      - ${DOCKER_DATA_PATH}/media/audiobooks:/audiobooks
      - ${DOCKER_DATA_PATH}/media/podcasts:/podcasts
    healthcheck:
      test: ["CMD-SHELL", "node -e 'require(\"http\").get(\"http://localhost:80/healthcheck\", (res) => process.exit(res.statusCode === 200 ? 0 : 1))' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - kry_net
      - traefik_proxy

  # ==========================================
  # Libation (Audible Downloader - Silent Background Sync)
  # ==========================================
  libation:
    image: rmcrackan/libation:latest
    container_name: libation
    restart: unless-stopped
    user: "568:568"
    environment:
      - TZ=${TZ}
      - SLEEP_TIME=60m
    volumes:
      # Configs (AccountsSettings.json, Settings.json, libation-master.key)
      - ${DOCKER_CONFIG_PATH}/libation:/config
      # Media Mapping: writes directly to the Audiobookshelf library
      - /mnt/andromeda/media/audiobooks:/data
    networks:
      - kry_net
      - traefik_proxy

networks:
  kry_net:
    external: true
  traefik_proxy:
    external: true