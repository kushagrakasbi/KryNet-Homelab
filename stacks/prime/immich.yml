services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-v3}
    volumes:
      - /mnt/andromeda/apps/immich/uploads:/data
      - /etc/localtime:/etc/localtime:ro
    ports:
      - 2283:2283
    env_file:
      - stack.env
    depends_on:
      - redis
      - database
    restart: unless-stopped
    healthcheck:
      disable: false
    networks:
      - kry_net
      - traefik_proxy

  # ML for Immich is offloaded to Legion (stacks/legion/immich-ml.yml: http://192.168.0.150:3003)
  # immich-machine-learning:
  #   container_name: immich_machine_learning
  #   image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-v3}-cuda
  #   volumes:
  #     - /mnt/andromeda/apps/immich/ml:/cache
  #   restart: unless-stopped
  #   env_file:
  #     - stack.env
  #   healthcheck:
  #     disable: false
  #   environment:
  #     - MACHINE_LEARNING__FACE_RECOGNITION_MODEL=mobile_face
  #     - MACHINE_LEARNING__FACE_DETECTION_MODEL=yunet
  #     - MACHINE_LEARNING__CLIP_MODEL=ViT-B-16__laion2b_s34b_b88k
  #   networks:
  #     - kry_net
  #     - traefik_proxy

  # Redis for Immich
  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:8-bookworm@sha256:42cba146593a5ea9a622002c1b7cba5da7be248650cbb64ecb9c6c33d29794b1
    healthcheck:
      test: redis-cli ping || exit 1
    restart: unless-stopped
    networks:
      - kry_net
      - traefik_proxy

  # Postgres for Immich
  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: --data-checksums
      DB_STORAGE_TYPE: 'HDD'
    ports:
      - "5432:5432"
    env_file:
      - stack.env
    volumes:
      - /mnt/andromeda/apps/immich/db:/var/lib/postgresql/data
    shm_size: 128mb
    restart: unless-stopped
    networks:
      - kry_net
      - traefik_proxy

  # Power Tools for Immich
  power-tools:
    container_name: immich_power_tools
    image: ghcr.io/varun-raj/immich-power-tools:latest
    ports:
      - "8001:3000"
    env_file:
      - stack.env
    restart: unless-stopped
    networks:
      - kry_net
      - traefik_proxy

networks:
  kry_net:
    external: true
  traefik_proxy:
    external: true